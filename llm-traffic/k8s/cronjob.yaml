# Runs traffic.py once a day: a random set of predefined conversations against
# the OpenAI, Anthropic and Gemini providers in Agent Manager.
#
# Provider URLs, keys and models come from the Secret "llm-traffic-providers"
# (see secret.example.yaml and the README). Run settings are in the ConfigMap.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llm-traffic
  labels:
    app.kubernetes.io/name: llm-traffic
    app.kubernetes.io/part-of: meridian-demo
spec:
  schedule: "0 9 * * *"
  timeZone: Asia/Colombo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Start jitter (up to 1h) + up to 24 conversations with pauses fits easily.
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: llm-traffic
            app.kubernetes.io/part-of: meridian-demo
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: traffic
              image: meridian/llm-traffic:0.1.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: llm-traffic-settings
                - secretRef:
                    name: llm-traffic-providers
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
