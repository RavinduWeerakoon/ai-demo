# Template only; don't commit real keys. See the README for a kubectl command
# that creates this Secret without writing keys to a file.
#
# <PROVIDER>_URL is the provider's proxy URL in Agent Manager, without the API
# path: the script appends /chat/completions (OpenAI), /v1/messages (Anthropic)
# or /v1beta/models/<model>:generateContent (Gemini).
# A provider whose URL or key is missing is skipped.
apiVersion: v1
kind: Secret
metadata:
  name: llm-traffic-providers
  namespace: meridian-demo
type: Opaque
stringData:
  OPENAI_URL: https://REPLACE-ME/<openai-provider>
  OPENAI_API_KEY: REPLACE-ME
  OPENAI_MODELS: gpt-4o-mini,gpt-4o
  ANTHROPIC_URL: https://REPLACE-ME/<anthropic-provider>
  ANTHROPIC_API_KEY: REPLACE-ME
  ANTHROPIC_MODELS: claude-haiku-4-5,claude-sonnet-4-5
  GEMINI_URL: https://REPLACE-ME/<gemini-provider>
  GEMINI_API_KEY: REPLACE-ME
  GEMINI_MODELS: gemini-2.5-flash,gemini-2.5-pro
  # Optional: the header each proxy expects the key in (default X-API-Key).
  # OPENAI_KEY_HEADER: X-API-Key
