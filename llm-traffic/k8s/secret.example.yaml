# Template only; don't commit real keys. See the README for a kubectl command
# that creates this Secret without writing keys to a file.
#
# One API key per agent, issued for that agent in Agent Manager. The key goes
# in each request's "api-key" header (override with <ID>_KEY_HEADER).
apiVersion: v1
kind: Secret
metadata:
  name: llm-traffic-agent-keys
  namespace: meridian-demo
type: Opaque
stringData:
  HOTEL_BOOKING_API_KEY: REPLACE-ME
  LEAVE_ASSISTANT_API_KEY: REPLACE-ME
  ROOM_SERVICE_API_KEY: REPLACE-ME
