server {
  listen 8080;
  root /usr/share/nginx/html;

  # Frames may only show the demo's own sites, whatever ?left= / ?right= say;
  # and this page itself must not be framed.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-src https://*.agent-manager.wso2demos.com https://*.agents.agent-manager.wso2demos.com; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / { try_files $uri /index.html; }
}
