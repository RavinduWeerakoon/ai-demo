# The demo website (web/). Its chat server action calls the agents from inside
# the cluster, so agent URLs and keys stay in the pod and never reach browsers.
#
# Secrets it reads:
#   concierge-unmanaged-api-key   AGENT_API_KEY (the same key the unmanaged agent checks)
#   meridian-web-managed-agent    MANAGED_AGENT_URL, MANAGED_AGENT_API_KEY (optional:
#                                 until it exists the managed toggle reports "not configured")
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-web
  labels:
    app.kubernetes.io/name: meridian-web
    app.kubernetes.io/part-of: meridian-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meridian-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meridian-web
        app.kubernetes.io/part-of: meridian-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: meridian/web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: UNMANAGED_AGENT_URL
              value: http://concierge-unmanaged:8000/chat
            - name: UNMANAGED_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: concierge-unmanaged-api-key
                  key: AGENT_API_KEY
            - name: MANAGED_AGENT_URL
              valueFrom:
                secretKeyRef:
                  name: meridian-web-managed-agent
                  key: MANAGED_AGENT_URL
                  optional: true
            - name: MANAGED_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meridian-web-managed-agent
                  key: MANAGED_AGENT_API_KEY
                  optional: true
            # The single demo login. Optional: until the Secret exists nobody
            # can sign in, but the site still starts.
            - name: DEMO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: meridian-web-login
                  key: DEMO_USERNAME
                  optional: true
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meridian-web-login
                  key: DEMO_PASSWORD
                  optional: true
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Next.js writes its image and fetch caches here.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: meridian-web
  labels:
    app.kubernetes.io/name: meridian-web
    app.kubernetes.io/part-of: meridian-demo
spec:
  selector:
    app.kubernetes.io/name: meridian-web
  ports:
    - name: http
      port: 3000
      targetPort: http
