# Split-view page (split-view/): the Meridian site and the Agent Manager console
# side by side in two resizable iframes. Static files served by unprivileged nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: split-view
  labels:
    app.kubernetes.io/name: split-view
    app.kubernetes.io/part-of: meridian-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: split-view
  template:
    metadata:
      labels:
        app.kubernetes.io/name: split-view
        app.kubernetes.io/part-of: meridian-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: meridian/split-view:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx writes its pid file and temp buffers here.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: split-view
  labels:
    app.kubernetes.io/name: split-view
    app.kubernetes.io/part-of: meridian-demo
spec:
  selector:
    app.kubernetes.io/name: split-view
  ports:
    - name: http
      port: 8080
      targetPort: http
