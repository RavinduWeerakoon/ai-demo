# Template only; do not commit a real key. Prefer:
#   kubectl -n meridian-demo create secret generic concierge-openai --from-literal=OPENAI_API_KEY=sk-...
apiVersion: v1
kind: Secret
metadata:
  name: concierge-openai
  namespace: meridian-demo
type: Opaque
stringData:
  OPENAI_API_KEY: sk-REPLACE-ME
---
# Template only. Prefer:
#   kubectl -n meridian-demo create secret generic concierge-unmanaged-api-key --from-literal=AGENT_API_KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: concierge-unmanaged-api-key
  namespace: meridian-demo
type: Opaque
stringData:
  AGENT_API_KEY: REPLACE-ME
---
# Template only. Prefer:
#   kubectl -n meridian-demo create secret generic meridian-web-managed-agent \
#     --from-literal=MANAGED_AGENT_URL='https://.../chat' --from-literal=MANAGED_AGENT_API_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: meridian-web-managed-agent
  namespace: meridian-demo
type: Opaque
stringData:
  MANAGED_AGENT_URL: https://REPLACE-ME/chat
  MANAGED_AGENT_API_KEY: REPLACE-ME
---
# Template only. The single demo login for the website. Prefer:
#   kubectl -n meridian-demo create secret generic meridian-web-login \
#     --from-literal=DEMO_USERNAME=demo --from-literal=DEMO_PASSWORD="$(openssl rand -base64 18)"
apiVersion: v1
kind: Secret
metadata:
  name: meridian-web-login
  namespace: meridian-demo
type: Opaque
stringData:
  DEMO_USERNAME: demo
  DEMO_PASSWORD: REPLACE-ME
---
# Template only. Moesif management API key for the AI Insights dashboard
# (read access to events only). Prefer creating it without a file:
#   read -rs "MOESIF_KEY?Moesif key: " && kubectl -n meridian-demo create secret generic \
#     insights-moesif --from-literal=MOESIF_CANVAS_KEY="$MOESIF_KEY"; unset MOESIF_KEY
apiVersion: v1
kind: Secret
metadata:
  name: insights-moesif
  namespace: meridian-demo
type: Opaque
stringData:
  MOESIF_CANVAS_KEY: REPLACE-ME
