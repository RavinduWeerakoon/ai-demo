# Mock hotel MCP server. Both agents use it:
#   unmanaged agent -> http://hotel-mcp.meridian-demo.svc.cluster.local:8090/mcp (direct)
#   managed agent   -> Agent Manager MCP proxy -> the same URL as its upstream
#
# Keep replicas at 1: bookings, refunds and staff messages live in process
# memory, so a second pod would show a different demo state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-mcp
  labels:
    app.kubernetes.io/name: hotel-mcp
    app.kubernetes.io/part-of: meridian-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hotel-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hotel-mcp
        app.kubernetes.io/part-of: meridian-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hotel-mcp
          image: meridian/hotel-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-mcp
  labels:
    app.kubernetes.io/name: hotel-mcp
    app.kubernetes.io/part-of: meridian-demo
spec:
  selector:
    app.kubernetes.io/name: hotel-mcp
  ports:
    - name: http
      port: 8090
      targetPort: http
