# https://hotel-mcp.agents.agent-manager.wso2demos.com/mcp
# TLS terminates on the shared data-plane gateway with its publicly trusted
# wildcard certificate, so the Agent Manager MCP proxy can use this as an
# https upstream with no custom CA. Only /mcp is routed: the /admin/* routes
# (demo state, including staff messages with guest PII) stay cluster-internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hotel-mcp
  labels:
    app.kubernetes.io/name: hotel-mcp
    app.kubernetes.io/part-of: meridian-demo
spec:
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-data-plane
      sectionName: https
  hostnames:
    - hotel-mcp.agents.agent-manager.wso2demos.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: hotel-mcp
          port: 8090
